<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>RETRO ARCADE — 6분할 라이브 월</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; }
  .wall { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); gap:6px; height:100vh; padding:6px; }
  .cell { position:relative; background:#0a0a12; border:1px solid #222244; border-radius:8px; overflow:hidden; }
  iframe { width:100%; height:100%; border:0; }
  .label { position:absolute; top:6px; left:10px; z-index:5; font-family:monospace; font-size:13px;
           color:#e94560; background:#000a; padding:2px 10px; border-radius:10px; letter-spacing:1px; pointer-events:none; }
</style>
</head>
<body>
<div class="wall" id="wall"></div>
<script>
// 6개 게임 동시 자동실행 (?auto= 로비 건너뛰고 즉시 플레이)
const GAMES = ['pong','snake','flappy','blockfall','brickbreak','runner'];
const wall = document.getElementById('wall');
GAMES.forEach((g) => {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.innerHTML = `<span class="label">${g.toUpperCase()}</span><iframe src="../index.html?auto=${g}"></iframe>`;
  wall.appendChild(cell);
});
</script>
</body>
</html>
